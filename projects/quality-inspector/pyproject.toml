[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "webcollect-quality-inspector"
version = "0.5.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.26,<5", "Pillow>=13,<14"]
[project.scripts]
webcollect-qc = "quality_inspector.__main__:main"
webcollect-ai-qc = "quality_inspector.ai_worker:main"

[project.optional-dependencies]
ai = ["webcollect>=0.2.0"]
[tool.setuptools.packages.find]
include = ["quality_inspector*"]

[tool.setuptools.package-data]
quality_inspector = ["review.html", "delivery.json", "contract-authority.json", "authority/*.md"]
