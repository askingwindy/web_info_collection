[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "webcollect-quality-inspector"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.26,<5", "Pillow>=13,<14"][tool.setuptools.packages.find]
include = ["quality_inspector*"]

[tool.setuptools.package-data]
quality_inspector = ["review.html", "delivery.json", "contract-authority.json", "authority/*.md", "vision_ocr.swift"]
