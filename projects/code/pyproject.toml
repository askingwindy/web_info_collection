[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webcollect"
version = "0.2.0"
description = "WebCollect 样本骨架与结构校验"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5", "Pillow>=13,<14", "playwright>=1.64,<2"]

[project.scripts]
webcollect = "webcollect.__main__:main"

[tool.setuptools.packages.find]
include = ["webcollect*"]

[tool.setuptools.package-data]
webcollect = ["schemas/*.json", "snapshot.js", "content_preparation.js", "media_preflight.js"]
